<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codeforces Streak Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>Codeforces Streak Settings</h1>
      <form id="settings-form">
        <label for="username">Codeforces username</label>
        <input id="username" name="username" type="text" placeholder="tourist" required />
        <button type="submit">Save</button>
      </form>
      <button id="clear" type="button" class="secondary">Clear saved data</button>
      <p id="status"></p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
